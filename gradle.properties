# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Java version required by this Minecraft version (also used by the CI workflows)
java_version=25

# Fabric, check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.162.0+26.3

# Mod Properties
mod_version=1.1.0
maven_group=me.lumpy.monkey
archives_base_name=compostable-rottenflesh

# Publishing (./gradlew publishMods)
# Comma-separated Minecraft versions this build is uploaded for
publish_minecraft_versions=26.3
# Minecraft version range for fabric.mod.json
minecraft_dependency=>=26.3 <26.4
curseforge_id=452832
modrinth_id=e70llbX2
